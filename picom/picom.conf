#################################
#     Backend & Rendimiento     #
#################################

backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
vsync = true;

#################################
#          Sombras              #
#################################

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;

shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'dwm'",
  "class_g = 'dmenu'",
  "name = 'dmenu'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#          Opacidad             #
#################################

active-opacity = 1.0;
inactive-opacity = 0.90;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
  "class_g = 'dmenu'",
  "name = 'dmenu'"
];

#################################
#      Bordes Redondeados       #
#################################

# corner-radius = 8;

corner-radius-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'dwm'",
  "class_g = 'dmenu'",
  "name = 'dmenu'"
];

#################################
#     Desenfoque (Blur)         #
#################################

blur: {
  method = "box";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'dwm'",
  "class_g = 'dmenu'",
  "name = 'dmenu'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#         Animaciones           #
#################################

animations = true;
animation-stiffness = 180;
animation-window-mass = 0.7;
animation-dampening = 15;
animation-clamping = true;

animation-for-open-window = "zoom";
animation-for-unmap-window = "squeeze";
animation-for-workspace-switch-in = "slide-left";
animation-for-workspace-switch-out = "slide-left";

#################################
#      Reglas Generales         #
#################################

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; opacity = 0.95; };
  dropdown_menu = { shadow = false; opacity = 0.95; };
};
