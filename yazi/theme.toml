# Yazi Theme Configuration - Nord

[manager]
cwd = { fg = "#88c0d0" }

# Hovered
hovered         = { bg = "#4c566a", bold = true }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#ebcb8b", italic = true }
find_position = { fg = "#b48ead", bg = "reset", italic = true }

# Marker
marker_copied   = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut      = { fg = "#bf616a", bg = "#bf616a" }
marker_marked   = { fg = "#81a1c1", bg = "#81a1c1" }
marker_selected = { fg = "#ebcb8b", bg = "#ebcb8b" }

# Stat
stat_normal   = { fg = "#d8dee9", bg = "#3b4252" }
stat_sel_num  = { fg = "#2e3440", bg = "#88c0d0", bold = true }
stat_sel_rev  = { fg = "#2e3440", bg = "#81a1c1", bold = true }
stat_rel_num  = { fg = "#4c566a" }

# Help
help_icode   = { fg = "#ebcb8b" }
help_args    = { fg = "#81a1c1" }
help_footer  = { fg = "#d8dee9", bg = "#3b4252" }

[status]
separator_open  = ""
separator_close = ""

mode_normal = { fg = "#2e3440", bg = "#81a1c1", bold = true }
mode_select = { fg = "#2e3440", bg = "#a3be8c", bold = true }
mode_unset  = { fg = "#2e3440", bg = "#bf616a", bold = true }

progress_label  = { fg = "#d8dee9", bold = true }
progress_normal = { fg = "#434c5e", bg = "#3b4252" }
progress_error  = { fg = "#bf616a", bg = "#3b4252" }

permissions_t = { fg = "#a3be8c" }
permissions_r = { fg = "#ebcb8b" }
permissions_w = { fg = "#bf616a" }
permissions_x = { fg = "#88c0d0" }
permissions_s = { fg = "#4c566a" }

[input]
border   = { fg = "#88c0d0" }
title    = { fg = "#d8dee9", bold = true }
value    = { fg = "#d8dee9" }
selected = { bg = "#4c566a" }

[completion]
border   = { fg = "#88c0d0" }
active   = { fg = "#2e3440", bg = "#88c0d0", bold = true }
inactive = { fg = "#d8dee9" }

[tasks]
border  = { fg = "#88c0d0" }
title   = { fg = "#d8dee9", bold = true }
hovered = { bg = "#4c566a", bold = true }

[which]
mask     = { bg = "#3b4252" }
cand     = { fg = "#88c0d0" }
rest     = { fg = "#a5abb6" }
desc     = { fg = "#d8dee9" }
separator = "  "

[filetype]
rules = [
	# Media
	{ mime = "image/*", fg = "#a3be8c" },
	{ mime = "{audio,video}/*", fg = "#b48ead" },
	# Archives
	{ mime = "application/*zip", fg = "#ebcb8b" },
	{ mime = "application/x-*tar*", fg = "#ebcb8b" },
	{ mime = "application/x-bzip*", fg = "#ebcb8b" },
	{ mime = "application/x-7z-compressed", fg = "#ebcb8b" },
	# Documents
	{ mime = "application/pdf", fg = "#bf616a" },
]
