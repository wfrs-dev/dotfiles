set -g default-terminal "screen-256color"
# UNBIND
#unbind-key -a
unbind -T copy-mode-vi Enter
unbind C-b
unbind C-c

# changing prefix from 'Ctrl+b' to 'Ctrl+Space'
set -g prefix C-Space
bind-key C-Space send-prefix

# Some settings
set -g default-shell '/bin/fish'
set -g history-limit 20000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
set -g mouse on
set -g status-position top
setw -g allow-rename off
setw -g automatic-rename off
setw -g aggressive-resize on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
# Change pane colors
set -g pane-active-border fg=red

# MAPPINGS
# Move between panes using arrows (Dvorak - ldvd)
bind-key r select-pane -L
bind-key s select-pane -R
bind-key n select-pane -U
bind-key t select-pane -D
# Move between windows
bind-key h previous-window
bind-key l next-window
# zoom
bind-key z resize-pane -Z
# Resize panes using Alt-arrow without prefix
bind-key -n M-Left resize-pane -L
bind-key -n M-Right resize-pane -R
bind-key -n M-Up resize-pane -U
bind-key -n M-Down resize-pane -D
# Splitting terminals
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
# Reload Config
bind-key p source-file ~/.config/tmux/tmux.conf \; display-message "   Configuración recargada...                                   "
# New window
# bind-key c new-window -c "#{pane_current_path}" \; command-prompt -p "Nombre: " "rename-window '%%'"
# Swap panes
bind-key Tab swap-pane -D
bind-key BTab swap-pane -U
# Layouts
bind-key 1 select-layout main-horizontal
bind-key 2 select-layout main-horizontal-mirrored
bind-key 3 select-layout main-vertical
bind-key 4 select-layout main-vertical-mirrored

#Copy and Paste
bind-key [ copy-mode
bind-key ] paste-buffer
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -se c -i'


# bind-key c display-popup -E 'bash -i -c "read -p \"Window Name:\" name; tmux new-window -d -s \$name && tmux switch -t \$name'
# bind-key c display-popup -E -w 40% -h 20% -b rounded "tmux command-prompt -p 'Nombre de la ventana:' 'new-window -n \"%%\"'"
# Pedir el nombre usando bash dentro del popup flotante
# Crear una nueva ventana
bind-key c display-popup -E -w 40% -h 3 -b rounded "bash -c 'read -p \"Nombre de la ventana: \" name; [ -n \"\$name\" ] && tmux new-window -n \"\$name\"'"
# Abrir lazygit
bind-key a display-popup -E -w 80% -h 80% -b rounded -d "#{pane_current_path}" "lazygit"
bind-key w display-popup -E -w 30% -h 30% -b rounded "tmux list-panes -a -F '#{session_name}:#{window_index}.#{pane_index} #{?window_active, , }[#{window_name}|#{pane_current_command}]' | fzf --reverse --prompt='Ir al panel: ' | sed 's/^[^0-9a-zA-Z]*//' | cut -d' ' -f1 | xargs tmux switch-client -t"
bind-key v display-popup -E -w 85% -h 85% -b rounded -d "~/cortana"  "zvim todo.md"
bind-key ñ display-popup -E -w 80% -h 50% -b rounded -d " fish"


# ######################
# ### DESIGN CHANGES ###
# ######################


set -g status-left-length "80"

# 2. Centrar la lista de ventanas en la barra
set -g status-justify centre

# 3. Estilo base de la barra de estado (Fondo oscuro)
set -g status-style bg=#1e1e2e,fg=#a6adc8

# 4. Estilo de las VENTANAS INACTIVAS (Texto gris claro)
# Se usará un gris claro (#bac2de / colour250) sobre fondo transparente/oscuro
set -g window-status-format "#[fg=#666666,bg=default] #I:#W#{?window_zoomed_flag, 󰊓 , } "

# 5. Estilo de la VENTANA ACTIVA (Texto en negro)
# Para garantizar legibilidad, se asigna texto negro (#000000) con fondo claro o resaltado (#a6e3a1)
set -g window-status-current-format "#[fg=#ffffff,bg=#1e1e2e,bold] #I:#W#{?window_zoomed_flag, 󰊓 , }#[default] "

# 6. Opcional: Limpiar o personalizar los extremos para que no saturen el centro
set -g status-left "#[fg=#89b4fa,bold]  [#S]#[default]"
set -g status-right "#[fg=#89b4fa,bold]  ( #{window_index}, #{pane_index}) #[default]"

set -g message-style fg=#ffffff,bg=#1e1e2e,bold


