## PLUGINS
# EasyJump
set-option -g @easyjump-key-binding "g"
set-option -g @easyjump-smart-case "on"
set-option -g @easyjump-label-chars "aoeiudrtnspyfchlmkxb"
set-option -g @easyjump-label-attrs "\e[1m\e[38;5;160m"
set-option -g @easyjump-text-attrs "\e[0m\e[38;5;234m"
set-option -g @easyjump-auto-begin-selection "on"
run-shell "~/.config/tmux/plugin/easyjump/easyjump.tmux"
