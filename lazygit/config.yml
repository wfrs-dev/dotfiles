gui:
  theme:
    # Color de bordes para ventanas inactivas
    inactiveBorderColor:
      - "#4c566a"
    # Color de bordes para la ventana activa
    activeBorderColor:
      - "#88c0d0"
      - "bold"
    # Color del texto de las opciones seleccionadas en listas
    selectedLineBgColor:
      - "#4c566a"
    # Color de las opciones de menú o pestañas seleccionadas
    optionsTextColor:
      - "#81a1c1"
    # Color del título de los paneles activos
    selectedChefColor:
      - "#ebcb8b"
    # Colores para información de ramas y confirmaciones (commits)
    cherryPickedCommitBgColor:
      - "#b48ead"
    cherryPickedCommitFgColor:
      - "#2e3440"
    unstagedChangesColor:
      - "#bf616a"
    defaultFgColor:
      - "#d8dee9"
